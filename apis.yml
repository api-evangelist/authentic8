name: Authentic8
description: 'Authentic8 is a cybersecurity company best known for Silo, a cloud-based
  secure browser and digital investigations platform. Silo isolates web activity in
  the cloud so analysts, investigators, and enterprise users can browse the surface,
  deep, and dark web anonymously with managed attribution, region masking, and full
  audit and governance controls. The company serves intelligence, law enforcement,
  financial crime, fraud, and corporate security teams, and delivers its service as
  a FedRAMP-authorized SaaS with SOC 2, ISO 27001/27701, PCI DSS, HIPAA, and GDPR
  compliance. Authentic8 is backed by Foundry Group and does not currently publish
  a public developer API. This profile tracks the company in the API Evangelist network.'
