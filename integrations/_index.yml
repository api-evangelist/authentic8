# Authentic8 integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in authentic8-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: authentic8-fedramp
  label: FedRAMP
  partner_name: FedRAMP
  category: FedRAMP authorization
  type: contract
  channel: regulator-register
  evidence: https://marketplace.fedramp.gov/products/FR1814168113
  source: edge
  relationship: standard-participant
  contract_reference:
    register: FedRAMP Marketplace data (github.com/18F/fedramp-data data/data.json @4b73d9247f)
    standard: FedRAMP
    spec_file: null
    role: fedramp-authorized
    registered_name: Authentic8, Inc.
    register_id: FR1814168113
    matched_domain: authentic8.com
    matched_by: domain
    domain_source: website
    designations:
    - Compliant
    packages:
    - Silo
    service_models:
    - SaaS
    paths:
    - Agency
    signal_note: certified_products = one entry per AUTHORIZED impact level, never per package; packages, service
      models, paths and leveraging agencies are context, never counted. The register lists current designations
      only (revoked / expired are removed), so lapsed is always false
    detected_by: sweep-gov-cloud.py
    detected: '2026-10-15'
    certified_products:
    - product: FedRAMP Moderate
      impact_level: Moderate
      lapsed: false
      latest_authorization: '2020-11-19'
